name: Pre-flight & Contract Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Run Hygiene Scanner
        run: python .github/scripts/check_repo_hygiene.py

  validation-tests:
    name: Task Specs & Benchmark Contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio "google-adk~=1.0" pyyaml matplotlib pandas tensorflow-cpu

      - name: Run Pre-flight Validation Tests
        run: |
          PYTHONPATH=maxkernel/adk pytest -v maxkernel/adk/tests/validation/
