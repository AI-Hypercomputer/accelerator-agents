name: Code Formatting

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  format:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Verify Formatting (Fails if format is required)
        run: |
          cd MaxKernel
          ruff format --check . 
          
      - name: Verify Linting (Fails if lint issues exist)
        run: |
          cd MaxKernel
          ruff check .
