name: Unit Tests & Hygiene

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  hygiene:
    name: Repository Hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Check for committed bytecode or cache files
        run: |
          if git ls-files | grep -E '\.pyc$|__pycache__'; then
            echo "Error: Tracked .pyc or __pycache__ files found in git."
            exit 1
          fi

  unit-tests:
    name: MaxKernel Unit Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install minimal test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio "google-adk~=1.0" matplotlib pandas tensorflow-cpu

      - name: Run Hermetic Unit Tests
        run: |
          cd maxkernel/adk
          PYTHONPATH=. pytest -v auto_search/tests/ auto_agent/tests/
