  def get_inputs():
      import jax
      import jax.numpy as jnp

      def sub_channel_quantize(x: jax.Array, quant_dtype: jnp.dtype, wsz: int = 128):
          if jnp.issubdtype(quant_dtype, jnp.floating):
              dtype_info = jnp.finfo(quant_dtype)
          else:
              dtype_info = jnp.iinfo(quant_dtype)
          dtype_max = float(dtype_info.max)
          w_lst, scale_lst = [], []
          assert len(x.shape) >= 2
          assert x.shape[-2] % wsz == 0
          for i in range(0, x.shape[1], wsz):
              y = x[:, i : i + wsz, :]
              abs_max = jnp.abs(y).max(axis=1, keepdims=True)
              scale = (abs_max / dtype_max).astype(jnp.float32)
              w = (y / scale).astype(quant_dtype)
              w_lst.append(w)
              scale_lst.append(scale)
          return jnp.concat(w_lst, axis=1), jnp.concat(scale_lst, axis=1)

      def _parse_dtype(dtype_str: str) -> jnp.dtype:
          if dtype_str == 'bf16':
              return jnp.bfloat16
          elif dtype_str == 'fp8':
              return jnp.float8_e4m3fn
          elif dtype_str == 'fp4':
              return jnp.float4_e2m1fn
          elif dtype_str == 'int4':
              return jnp.int4
          else:
              raise ValueError(f'Unsupported dtype: {dtype_str}')

      CONFIGS = {'gmm_small': {'name': 'gmm_small', 'model': 'Megablox-GMM', 'operator': 'gmm_v2', 'num_tokens': 2048, 'hidden_size': 2048, 'intermediate_size': 1024, 'global_num_experts': 64, 'local_num_experts': 8, 'top_k': 4, 'weight_dtype': 'fp4', 'activation_dtype': 'fp8', 'quant_block_size': -1}, 'dsv4_pro_16k': {'name': 'dsv4_pro_16k', 'model': 'DeepSeek-V4-Pro', 'operator': 'gmm_v2', 'num_tokens': 16384, 'hidden_size': 7168, 'intermediate_size': 4096, 'global_num_experts': 256, 'local_num_experts': 16, 'top_k': 8, 'weight_dtype': 'fp4', 'activation_dtype': 'fp8', 'quant_block_size': -1}, 'dsv4_pro_8k': {'name': 'dsv4_pro_8k', 'model': 'DeepSeek-V4-Pro', 'operator': 'gmm_v2', 'num_tokens': 8192, 'hidden_size': 7168, 'intermediate_size': 4096, 'global_num_experts': 256, 'local_num_experts': 16, 'top_k': 8, 'weight_dtype': 'fp4', 'activation_dtype': 'fp8', 'quant_block_size': -1}, 'dsv4_flash_16k': {'name': 'dsv4_flash_16k', 'model': 'DeepSeek-V4-Flash', 'operator': 'gmm_v2', 'num_tokens': 16384, 'hidden_size': 4096, 'intermediate_size': 2048, 'global_num_experts': 256, 'local_num_experts': 16, 'top_k': 8, 'weight_dtype': 'fp4', 'activation_dtype': 'fp8', 'quant_block_size': -1}, 'dsv4_flash_8k': {'name': 'dsv4_flash_8k', 'model': 'DeepSeek-V4-Flash', 'operator': 'gmm_v2', 'num_tokens': 8192, 'hidden_size': 4096, 'intermediate_size': 2048, 'global_num_experts': 256, 'local_num_experts': 16, 'top_k': 8, 'weight_dtype': 'fp4', 'activation_dtype': 'fp8', 'quant_block_size': -1}}
      CONFIG = CONFIGS['gmm_small']

      def create_inputs(dtype=jnp.bfloat16, config=None):
          """Returns (lhs, rhs, group_sizes, rhs_scale, rhs_bias, group_offset)."""
          cfg = CONFIG if config is None else CONFIGS[config] if isinstance(config, str) else config
          key = jax.random.key(42)
          k1, k2, k3 = jax.random.split(key, 3)
          M = cfg['num_tokens']
          K = cfg['hidden_size']
          N = cfg['intermediate_size']
          G_local = cfg['local_num_experts']
          G_global = cfg['global_num_experts']
          weight_dtype = _parse_dtype(cfg.get('weight_dtype', 'fp4'))
          quant_block_size = cfg.get('quant_block_size', -1)
          lhs = (jax.random.uniform(k1, (M, K), dtype=dtype) - 0.5) * 0.2
          rhs = jax.random.normal(k2, (G_local, K, N), dtype=dtype) * 0.02
          tokens_per_expert = M // G_global
          remainder = M % G_global
          sizes = [tokens_per_expert + (1 if i < remainder else 0) for i in range(G_global)]
          group_sizes = jnp.array(sizes, dtype=jnp.int32)
          group_offset = jnp.array([0], dtype=jnp.int32)
          rhs_scale = None
          if weight_dtype != jnp.bfloat16:
              rhs_wsz = quant_block_size if quant_block_size > 0 else rhs.shape[1]
              rhs, rhs_scale = sub_channel_quantize(rhs, weight_dtype, rhs_wsz)
              rhs_scale = jnp.expand_dims(rhs_scale, axis=2)
          rhs_bias = None
          return (lhs, rhs, group_sizes, rhs_scale, rhs_bias, group_offset)

      outputs = []
      for cfg in CONFIGS.values():
          dynamic_args = list(create_inputs(dtype=jnp.bfloat16, config=cfg))
          static_args = []
          outputs.append((dynamic_args, static_args))
      return outputs

